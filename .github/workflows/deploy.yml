# Contrôles du site avant déploiement.
# Le déploiement lui-même est fait par l'intégration GitHub de Vercel :
#   develop            → production (canoplay-web.vercel.app / www.canoplay.fr)
#   toute autre branche → prévisualisation (URL commentée par Vercel sur la PR)

name: Contrôles du site

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: vercel.json est un JSON valide
        run: python3 -c "import json; json.load(open('vercel.json'))"
      - name: Les pages commitées sont à jour avec le générateur
        run: |
          python3 outils/generer_pages.py
          git diff --exit-code || { echo "::error::Pages non régénérées : lancer python3 outils/generer_pages.py et commiter."; exit 1; }
      - name: Chaque ressource et lien interne existe
        run: python3 outils/verifier_liens.py
